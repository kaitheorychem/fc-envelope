[project]
name = "fcenvelope"
version = "0.1.0"
description = "Franck-Condon envelope calculation from vibronic couplings, frequencies and temperature"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.scripts]
fcenvelope = "fcenvelope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcenvelope"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["test"]
