# usage.md「入力ファイル」の例。そのまま動く。
#   uv run fcenvelope run docs/readme/examples/basic.toml -o result.json

schema_version = 3
frequency_unit = "cm^-1"
coupling_convention = "g"   # coupling は無次元化 VCC の g。S = g^2
temperature = 300.0         # K

# 1 モード = 1 つの [[modes]]。並び順は結果に効かない。
[[modes]]
frequency = 1200.0
coupling = 0.5

[[modes]]
frequency = 450.0
coupling = 0.8

[broadening]
sigma = 150.0               # unit を省いたので cm^-1

[grid]
e_min = -4500.0
e_max = 1000.0

# グリッド数の指定。n を直接書くか、de から決めるかのどちらか（ADR-0070）。
# de = 4.0 だと全域グリッドが 4096 点（全域幅 16384）になり、端の折り返しに余裕が出る。
# 同じ窓でも de = 5.0 では 2048 点（10240）に留まり、edge_intensity_ratio が警告を出す。
[grid.points]
de = 4.0

[selection]
min_weight = 0.0001
max_lines = 10000
# max_quanta は省略すると自動（TOML に null はないので、書かずに既定へ任せる）
