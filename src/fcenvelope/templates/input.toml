# fcenvelope の入力ファイルの雛形。1 項目 1 行のコメントは何を設定する数かだけを言う。
# 書き方の決まりごとは docs/readme/usage.md にある。
# 単位には別名 "a.u." や倍率の組 [1e-3, "eV"] も書ける。値に添えるなら [18.6, 1e-3, "eV"]。
#   uv run fcenvelope run input.toml     # エンベロープ F(E)
#   uv run fcenvelope lines input.toml   # 離散 FC 因子の一覧
#
# ここから下は 3 つに分かれる。両方が読む設定、run だけが読む [broadening] / [grid]、
# lines だけが読む [selection] である。読まないほうのブロックは消してもよい。

schema_version = 4          # 入力ファイルの版。4 固定
temperature = 300.0         # 温度 T [K]。0 でもよい

# モード表。単位と流儀は表が持ち、ここに書いた単位は表の列にだけ効く。
[modes]
coupling_convention = "g"   # coupling の列の流儀。g / delta / huang_rhys / lambda / vcc
frequency_unit = "cm^-1"    # frequency の列の既定の単位
# coupling_unit = "cm^-1"   # coupling の列の既定の単位。有次元の流儀（lambda / vcc）のときだけ書く
# 行を CSV から読むなら [[modes.rows]] の代わりに次の 1 行。パスはこのファイルからの相対。
# 列に単位を添えるとその列はその単位で読む。columns を省けば frequency, coupling の順。
# csv = { path = "modes.csv", columns = ["frequency", ["coupling", "cm^-1"]] }

# 1 モード = 1 つの [[modes.rows]]。並び順は結果に効かない。
[[modes.rows]]
frequency = 1200.0          # 振動数 ε
coupling = 0.5              # 流儀に従った結合の値（g なら S = g^2）

[[modes.rows]]
frequency = 450.0
coupling = 0.8

# 線形状。run だけが読む。lines しか使わないならブロックごと省ける。
[broadening]
unit = "cm^-1"              # このブロックの値の既定の単位
sigma = 150.0               # 線 1 本のガウス幅 σ。値の側に単位を添えて [0.0186, "eV"] とも書ける

# エネルギーグリッド。run だけが読む。こちらもブロックごと省ける。
[grid]
unit = "cm^-1"              # e_min / e_max / points.de の既定の単位
e_min = -4500.0             # 出力窓の下端。E 軸の原点は ZPL で、サイドバンドは負側に立つ
e_max = 1000.0              # 出力窓の上端

# 全域グリッドの取り方。n と de のどちらか一方だけを書く。
[grid.points]
de = 4.0                    # 出力グリッド間隔 ΔE。点数はこれを満たす最小の 2 の冪になる
# shift = 1                 # de のときだけ。全域幅はそのままに点数を 2^shift 倍する
# n = 4096                  # 点数を直接書くならこちら。2 の冪のみ

# lines が拾う範囲。lines だけが読む。省くと下の既定値で埋まる（σ や E 窓と違う）。
[selection]
min_weight = 0.0001         # 保持する線の重みの下限
max_lines = 10000           # 保持・列挙する線数の上限
# max_quanta = 8            # 1 モードあたりの量子数の上限。省略すると自動
